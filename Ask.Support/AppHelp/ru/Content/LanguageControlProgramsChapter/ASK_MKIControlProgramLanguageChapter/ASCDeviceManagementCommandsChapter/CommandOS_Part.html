<!DOCTYPE html>

<head>
    <meta charset="utf-8">
    <title>5.3.6 Команда ОС (Общий Сброс)</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <script src="../../../../../internal-links.js" defer></script>

<body>
    <main class="page-content">

        <h2>5.3.6 Команда ОС (Общий Сброс)</h2>

        <p>
            Выполняет действия команды <a href="#" data-nav="СК">СК</a>, а также сброс всех измерителей АСК в исходное состояние.
        </p>

        <h3>Синтаксис</h3>
        <p>
            &lt;метка&gt; ОС
        </p>

        <h3>Пример</h3>
        <p>
            360 ОС
        </p>

        <h3>Правила</h3>
        <ul>
            <li>
                Команда <a href="#" data-nav="КЦ">КЦ</a> производит действия команды ОС, поэтому явное указание команды ОС перед командой <a href="#" data-nav="КЦ">КЦ</a> не требуется.
            </li>
        </ul>
    </main>
</body>
</html>
